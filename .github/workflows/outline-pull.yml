name: Outline pull (round-trip)

# Bidirectional half of the Outline sync: git -> Outline is `outline:sync`/
# `outline:reconcile` (see .github or run manually); this workflow is
# Outline -> git. It never touches main directly — for every
# `outline_locked: true` document whose live Outline content differs from
# git, it opens (or refreshes) a PR for a human to review and merge. See
# ops/wiki-backlog.md B-39/B-40 and skills/company-wiki/references/
# frontmatter-schema.md#outline_locked for the full design and rationale
# (why polling over a webhook, why per-document branches, etc).
#
# One-time setup required (cannot be done from a workflow file):
#   1. Repo secret OUTLINE_API_TOKEN (Settings -> Secrets and variables ->
#      Actions) — same token as ops/outline/outline.env on the server.
#   2. Optional repo variable OUTLINE_URL if it's not https://wiki.secretshop.ua.
#   3. Settings -> Actions -> General -> Workflow permissions -> enable
#      "Allow GitHub Actions to create and approve pull requests" (off by
#      default org-wide on many accounts; without it `gh pr create` 403s).

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: outline-pull
  cancel-in-progress: false

env:
  OUTLINE_URL: ${{ vars.OUTLINE_URL || 'https://wiki.secretshop.ua' }}
  OUTLINE_API_TOKEN: ${{ secrets.OUTLINE_API_TOKEN }}

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: List outline_locked documents
        run: node scripts/outline/pull-locked.mjs > locked-files.txt; cat locked-files.txt

      - name: Pull each locked document and open/update a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -s locked-files.txt ]; then
            echo "No outline_locked documents. Nothing to do."
            exit 0
          fi

          had_error=0

          # One doc fully processed (pull -> diff -> commit-or-discard) before
          # the next starts — deliberately not a batch pull-then-sort-out-git
          # pass, so no doc's uncommitted state can interfere with another's.
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "::group::$file"

            git checkout main

            slug=$(basename "$file" .md)
            if [ "$slug" = "index" ]; then
              slug=$(basename "$(dirname "$file")")
            fi
            branch="outline-pull/$slug"
            imgdir="docs/public/outline-imports/$slug"

            if ! node scripts/outline/pull.mjs --file "$file"; then
              echo "::warning::Failed to pull $file — see log above. Skipping (does not block other docs)."
              git checkout -- "$file" 2>/dev/null || true
              had_error=1
              echo "::endgroup::"
              continue
            fi

            if git diff --quiet -- "$file" "$imgdir" 2>/dev/null; then
              echo "No changes for $file."
              git checkout -- "$file" 2>/dev/null || true
              echo "::endgroup::"
              continue
            fi

            git checkout -B "$branch"
            git add "$file"
            [ -d "$imgdir" ] && git add "$imgdir"
            git commit -m "outline-pull: $file"
            git push --force origin "$branch"

            body=$(printf 'Automated pull of Outline-side edits for `%s`.\n\nReview before merging:\n- [ ] Content looks right (Outline reformats lists/tables on save — check no meaning was lost)\n- [ ] Images render correctly (downloaded to `%s`)\n- [ ] Unset `outline_locked: true` in this file once you are done editing in Outline\n\nGenerated by `.github/workflows/outline-pull.yml` from `scripts/outline/pull-locked.mjs` + `pull.mjs`.\n' "$file" "$imgdir")

            existing=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              gh pr edit "$existing" --body "$body"
              echo "Updated PR #$existing for $file"
            else
              gh pr create --head "$branch" --base main --title "Outline edits: $file" --body "$body"
              echo "Opened PR for $file"
            fi

            echo "::endgroup::"
          done < locked-files.txt

          exit $had_error
